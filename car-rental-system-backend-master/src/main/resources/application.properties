spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}
server.port=${SERVER_PORT:8080}

# MySQL - no defaults are committed; SPRING_DATASOURCE_URL/USERNAME/PASSWORD must be provided via environment
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Mail
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:codewithmurad@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# File storage (defaults are container-friendly relative dirs)
com.carrentalsystem.image.variant.folder.path=${VARIANT_DIR:files/variant-image}
com.carrentalsystem.image.license.folder.path=${LICENSE_DIR:files/license-image}


spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

springdoc.packagesToScan=com.carrentalsystem.controller
springdoc.pathsToMatch=/api/**
